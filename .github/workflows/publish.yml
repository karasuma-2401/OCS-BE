name: Publish API Image

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Custom image tag override (optional)
        required: false
        type: string

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  publish:
    name: Build, Scan and Publish
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        contains(fromJSON('["dev", "main"]'), github.event.workflow_run.head_branch)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${GITHUB_SHA}"
            BRANCH="${GITHUB_REF_NAME}"
            CUSTOM_TAG="${{ inputs.image_tag }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            CUSTOM_TAG=""
          fi

          SHORT_SHA="${SHA:0:7}"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="ghcr.io/${OWNER}/ocs-api"
          FLOATING_TAG="${CUSTOM_TAG:-$BRANCH}"

          TAGS="${IMAGE_NAME}:${FLOATING_TAG},${IMAGE_NAME}:sha-${SHORT_SHA}"
          if [ "$BRANCH" = "main" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi

          {
            echo "scan_tag=${IMAGE_NAME}:scan-${SHORT_SHA}"
            echo "push_tags=${TAGS}"
            echo "source_sha=${SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Build image for vulnerability scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OCS.Api/Dockerfile
          load: true
          push: false
          tags: ${{ steps.tags.outputs.scan_tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tags.outputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ocs-api
          cache-to: type=gha,mode=max,scope=ocs-api

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tags.outputs.scan_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      - name: Upload Trivy report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-ocs-api

      - name: Publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OCS.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.push_tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tags.outputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ocs-api
